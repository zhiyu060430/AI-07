name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firephantom
          POSTGRES_PASSWORD: firephantom-ci
          POSTGRES_DB: firephantom
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U firephantom -d firephantom"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FIREPHANTOM_TEST_POSTGRES_PASSWORD: firephantom-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: docker compose config
  platform-windows:
    runs-on: windows-latest
    env:
      FIREPHANTOM_SKIP_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_platform.py -o addopts=
      - run: python -c "import firephantom.physics.engine, firephantom.local, firephantom.paths, firephantom.runtime"
